# GOKU QA on GitHub's servers (your laptop/PC can stay OFF).
# Builds the game, serves it, lets the in-game GOKU partner play + audit it, then pushes the reports to the `reports` branch ONLY.
# Manual by default (Actions tab -> goku-qa -> Run workflow). Un-comment `schedule` for a weekly run.
# No secrets needed: it uses the built-in GITHUB_TOKEN. contents:write is required only to push the `reports` branch;
# scripts/publish_reports.sh refuses main/master. For a hard guarantee also protect `main` in Settings -> Branches.
name: goku-qa
on:
  workflow_dispatch:
    inputs:
      sim:
        description: 'Seconds of simulated time GOKU explores'
        default: '200'
  # schedule:
  #   - cron: '0 2 * * 1'
permissions:
  contents: write
concurrency:
  group: goku-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build
        run: |
          nohup npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/ >/dev/null
      - name: Restore the bug ledger from the reports branch
        run: |
          mkdir -p reports
          if git ls-remote --exit-code --heads origin reports >/dev/null 2>&1; then
            git fetch --quiet origin reports:refs/remotes/origin/reports
            git show origin/reports:ledger.json > reports/ledger.json 2>/dev/null || echo "no ledger yet"
          fi
      - name: GOKU QA (play + audits + self-test + performance budget)
        run: node tools/oz-explorer/goku_qa.mjs http://localhost:4173/ --sim "${{ inputs.sim || '200' }}" --cells 3 --selftest --out reports --render "SIMULATED (software GL on a GitHub runner)"
      - name: Game tests (results are saved in the report, they do not stop the upload)
        run: |
          set +e
          { echo "== smoke";  node tests/smoke.mjs http://localhost:4173/ reports/smoke.png
            echo "== a0";     node tests/a0_debug.mjs http://localhost:4173/
            echo "== goku";   node tests/goku_partner.mjs http://localhost:4173/; } 2>&1 | tee reports/tests.txt
          exit 0
      - name: Publish reports (branch "reports" only)
        run: bash scripts/publish_reports.sh reports
      - uses: actions/upload-artifact@v4
        with:
          name: goku-qa-reports
          path: reports
